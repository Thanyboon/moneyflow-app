<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MoneyFlow · ทดสอบเชื่อม Sheets</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f6f4ff;color:#26223c;max-width:650px;margin:30px auto;padding:18px}.card{background:white;padding:22px;border-radius:22px;box-shadow:0 8px 30px #544b881c}h1{color:#7155cc}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:12px;font-size:16px;margin:8px 0}input{border:1px solid #d9d3ed}button{border:0;background:#8063d9;color:white;font-weight:700}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word;background:#f5f3fc;padding:14px;border-radius:12px}small{color:#6e6881}</style></head><body><div class="card"><h1>💜 MoneyFlow · ทดสอบ Sheets</h1><p>ทดสอบ <b>อ่านเฉพาะชื่อแท็บและจำนวนแถว</b> ไม่แสดงยอดเงินหรือข้อมูลส่วนตัว และไม่แก้ไขชีต</p><label>Spreadsheet ID<input id="sheetId" placeholder="ข้อความระหว่าง /d/ และ /edit" autocomplete="off"></label><button id="login" disabled>เชื่อมบัญชี Google เพื่ออ่านข้อมูล</button><pre id="status">กำลังโหลดระบบเข้าสู่ระบบ...</pre><small>บัญชีที่เลือกต้องเป็น Test user และมีสิทธิ์เข้าถึงชีต · Access Token เก็บไว้ในหน่วยความจำของหน้านี้เท่านั้น</small></div><script>const CLIENT_ID='724296755056-dtdpqk5r6vv3b0bfucpps36d5d7b42mr.apps.googleusercontent.com';let client;const status=document.getElementById('status'),btn=document.getElementById('login');function show(s){status.textContent=s}window.initGIS=function(){try{client=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/spreadsheets.readonly',callback:async response=>{if(response.error){show('OAuth error: '+response.error);return}try{const id=document.getElementById('sheetId').value.trim();if(!/^[\w-]{20,}$/.test(id)){show('กรุณากรอก Spreadsheet ID ให้ถูกต้อง');return}show('กำลังตรวจสอบสิทธิ์...');const res=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(id)+'?fields=properties.title,sheets.properties(title,gridProperties.rowCount)',{headers:{Authorization:'Bearer '+response.access_token}});const data=await res.json();if(!res.ok)throw Error((data.error&&data.error.message)||'HTTP '+res.status);show('เชื่อมสำเร็จ ✅\nชื่อไฟล์: '+data.properties.title+'\nแท็บ:\n'+(data.sheets||[]).map(s=>'• '+s.properties.title+' ('+s.properties.gridProperties.rowCount+' แถวที่จัดสรร)').join('\n')+'\n\nทดสอบอ่านข้อมูลสำเร็จ โดยไม่ได้แก้ไขชีต');}catch(e){show('เชื่อมไม่สำเร็จ ❌\n'+e.message+'\nตรวจสอบบัญชีที่ล็อกอินและสิทธิ์แชร์ Google Sheets')}}});btn.disabled=false;show('พร้อมทดสอบ — ใส่ Spreadsheet ID แล้วกดปุ่ม');}catch(e){show('ตั้งค่า OAuth ไม่สำเร็จ: '+e.message)}};btn.onclick=()=>{if(!document.getElementById('sheetId').value.trim()){show('กรุณาใส่ Spreadsheet ID ก่อน');return}client.requestAccessToken({prompt:'consent'})};</script><script src="https://accounts.google.com/gsi/client" async defer onload="initGIS()"></script></body></html>
